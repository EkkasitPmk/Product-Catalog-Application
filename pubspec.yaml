name: catalog_x
description: "CatalogX - Modern Product Catalog Application in Flutter"
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.13.3

dependencies:
  flutter:
    sdk: flutter

  # State Management
  flutter_riverpod: ^2.6.1

  # Networking
  dio: ^5.7.0

  # UI & Media
  cached_network_image: ^3.4.1
  shimmer: ^3.0.0
  intl: ^0.20.2
  cupertino_icons: ^1.0.8

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  mocktail: ^1.0.4

flutter:
  uses-material-design: true

  assets:
    - assets/fonts/

  fonts:
    - family: baloo
      fonts:
        - asset: assets/fonts/Baloo2-Regular.ttf
          weight: 400
        - asset: assets/fonts/Baloo2-Medium.ttf
          weight: 500
        - asset: assets/fonts/Baloo2-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/Baloo2-Bold.ttf
          weight: 700
        - asset: assets/fonts/Baloo2-ExtraBold.ttf
          weight: 800

    - family: mali
      fonts:
        - asset: assets/fonts/Mali-Regular.ttf
          weight: 400
        - asset: assets/fonts/Mali-Medium.ttf
          weight: 500
        - asset: assets/fonts/Mali-Bold.ttf
          weight: 700
